[package]
name = "thunet"
version = "0.1.6"
edition = "2024"
description = "Minimal THUnet / SRun3K portal client (login, logout, status)"
license = "MIT"
repository = "https://github.com/yjmthu/thunet"
authors = ["THUnet contributors"]

[lib]
name = "thunet"
# Android packages this as `lib/<abi>/libthunet.so`; the desktop binary keeps
# linking the rlib.
crate-type = ["rlib", "cdylib"]

[dependencies]
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# Credential storage: one sealed blob on every platform (see `src/secret.rs`).
chacha20poly1305 = "0.10"
getrandom = "0.3"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
  "serde",
] }
clap = { version = "4", features = ["derive"] }
# `thunet completions <shell>` (bash, zsh, fish, elvish, PowerShell).
clap_complete = "4"
eframe = { version = "0.37.0", default-features = false, features = [
  "glow",
  "wgpu",
  "default_fonts",
  "clipboard",
  # `Hyperlink` / `Context::open_url` only reach the browser through
  # egui-winit's `webbrowser` dependency, which this feature enables.
  "links",
  # Android's activity glue. It only enables winit's Android backend, so it is
  # harmless on desktop.
  "android-native-activity",
  "x11",
  "wayland",
] }

sys-locale = "0.3.2"
interprocess = "2.4.6"
# Password prompt (`thunet login -i`): echo off with the terminal restored
# afterwards, and a Ctrl+C handler, without a hand-written console or termios call
# in this crate.
rpassword = "7.5"
ctrlc = "3.5"
# Decodes `assets/turtle.png` (already in the tree through eframe, so enabling it
# here adds no new crates; the `png` feature is all the icon needs).
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = true

# `pixi run -e package deb-debug`. cargo-deb refuses the built-in `dev` profile,
# so the debug package is built with this one instead: it inherits dev (debug
# assertions, full symbols) and lands in `target/pkgdebug/`.
[profile.pkgdebug]
inherits = "dev"

# Embeds assets/thunet.ico (and the version block) into the Windows executable.
[build-dependencies]
winresource = "0.1"

# The tray exists on every desktop; Android has no notification area.
[target.'cfg(not(target_os = "android"))'.dependencies]
tray-icon = "0.26.1"

# `AndroidApp` comes from winit; the Android feature itself is enabled through
# eframe's `android-native-activity`, and Cargo unifies it into this dependency.
[target.'cfg(target_os = "android")'.dependencies]
winit = "0.30"
# egui-winit's clipboard is in-process only on Android, so the Activity is
# called over JNI to reach the system clipboard (`src/clipboard.rs`).
jni = "0.21"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Console",
  # `CoCreateInstance`/`CoInitializeEx`: the Network List Manager names the
  # current network when `netsh` refuses to (Location services off).
  "Win32_System_Com",
  # `GetSystemPowerStatus`: a battery is the fallback that tells a laptop from a
  # desktop when the firmware does not report a chassis type.
  "Win32_System_Power",
  # `GetSystemFirmwareTable`: the raw SMBIOS table, whose System Enclosure
  # structure carries the same chassis type as the Linux sysfs file.
  "Win32_System_SystemInformation",
  # `SHELLEXECUTEINFOW` (used by the UAC elevation path) embeds an `HKEY`
  # field, so windows-sys gates it behind the Registry module.
  "Win32_System_Registry",
  # `ProcessIdToSessionId`: identify an interactive pipe client without opening
  # its process, which the unprivileged service account cannot do.
  "Win32_System_RemoteDesktop",
  # `CreateProcessAsUser` for an upgrade's window restore, and the environment
  # block it has to hand the child (SYSTEM's `%APPDATA%` is the wrong one).
  "Win32_System_Environment",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # `GetBestInterfaceEx` + `GetAdaptersAddresses`: which adapter carries the
  # default route, and whether it is a cable or Wi-Fi (the status page says so).
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }
# `thunet core --service`: only the Service Control Manager can start a process
# before anyone logs on, which is what makes the session come up with the
# machine instead of with the desktop.
windows-service = "0.8"
# Named pipes are created with an explicit security descriptor so a window
# running as the user can talk to a core running as SYSTEM (`ipc.rs`).
widestring = "1"

# Autostart on Linux and macOS. On Windows the tray is a per-user Task
# Scheduler logon task and the core is a service; on Linux the core is a system
# systemd unit. All of it lives in `src/autostart.rs`.
[target."cfg(not(windows))".dependencies]
auto-launch = "0.6.0"
libc = "0.2"

# `tray-icon` builds its Linux menu with gtk-rs, whose constructors panic unless
# `gtk::init()` ran first. eframe/winit never initialises GTK, so the app has to
# do it itself before creating the tray (see `ui::init_gtk`).
[target."cfg(target_os = \"linux\")".dependencies]
gtk = "0.18"
# GNOME on Wayland does not draw server-side decorations, and eframe turns off
# winit's default features, so without this the window has no title bar at all
# (no close / minimize buttons). Enabling the adwaita client-side decorations
# is the only way to get a normal window frame there.
winit = { version = "0.30", default-features = false, features = [
  "wayland-csd-adwaita",
] }

# `cargo deb` (pixi run -e package deb). The binary, launcher entry and icon are
# installed system-wide; user settings and autostart stay per user.
[package.metadata.deb]
name = "thunet"
maintainer = "THUnet contributors"
section = "net"
priority = "optional"
maintainer-scripts = "packaging/debian"
# libgtk-3 drives the tray; libappindicator is dlopen()ed at startup and
# panics when absent, so both are hard dependencies. Alternatives cover
# Debian <= 12 (libgtk-3-0 / libappindicator3-1) and Ubuntu >= 24.04
# (libgtk-3-0t64 / libayatana-appindicator3-1).
# `pkexec` is what the window uses to register, start and stop the service
# (`pkexec` is its own package since polkit 123; Debian 12 still ships the same
# binary inside `policykit-1`).
depends = "libc6, libgl1, libegl1, libxkbcommon0, libwayland-client0, libx11-6, libxcursor1, libxi6, libxrandr2, libfontconfig1, libgtk-3-0 | libgtk-3-0t64, libayatana-appindicator3-1 | libappindicator3-1, pkexec | policykit-1"
extended-description = """\
Tray client for the Tsinghua University campus network: logs in through the
SRun portal, keeps the session alive, shows the assigned addresses and traffic,
and can start with the desktop."""
assets = [
  ["target/release/thunet", "usr/bin/", "755"],
  ["assets/thunet.service", "usr/lib/systemd/system/thunet.service", "644"],
  ["assets/thunet.desktop", "usr/share/applications/", "644"],
  ["assets/thunet.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
  ["README.md", "usr/share/doc/thunet/README.md", "644"],
  # Checked in under `assets/` and kept in sync by a unit test, so `cargo deb`
  # works on its own; regenerate with `cargo run -- completions <shell>`.
  ["assets/completions/thunet.bash", "usr/share/bash-completion/completions/thunet", "644"],
  ["assets/completions/_thunet", "usr/share/zsh/vendor-completions/_thunet", "644"],
  ["assets/completions/thunet.fish", "usr/share/fish/vendor_completions.d/thunet.fish", "644"],
]
