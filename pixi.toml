[workspace]
authors = ["THUnet contributors"]
channels = ["conda-forge"]
name = "thunet"
platforms = ["win-64", "linux-64"]

[tasks]

[environments]
tools = ["tools"]
dev = ["dev"]
package = ["package", "dev"]

[dependencies]
python = "3.14.*"

[feature.tools.dependencies]
python = "*"

[feature.dev.dependencies]
rust = "*"

[feature.dev.target.win-64.dependencies]
vs2026_win-64 = "*"

[feature.dev.target.linux-64.dependencies]
compilers = "*"
# GTK development files for building `tray-icon` (it links gtk-rs on Linux).
# conda's pkg-config needs `scripts/activate_linux.sh` to find these `.pc` files.
pkg-config = "*"
gtk3 = "*"
zlib = "*"
expat = "*"
libffi = "*"
pcre2 = "*"
libxml2 = "*"
libpng = "*"
brotli = "*"
bzip2 = "*"

[feature.dev.target.linux-64.activation]
scripts = ["scripts/activate_linux.sh"]

# ------------------------------------------------------------------ packaging
# `pixi run -e package msi`   -> dist/thunet-<version>-x64.msi      (Windows)
# `pixi run -e package deb`   -> dist/thunet_<version>-1_amd64.deb (Debian/Ubuntu)
# `pixi run -e package tarball` -> dist/thunet-<version>-linux-x64.tar.gz

[feature.package.target.win-64.dependencies]
dotnet = "8.*"

[feature.package.target.linux-64.dependencies]
# The GTK/build dependencies live in the `dev` feature, which this environment
# includes; only the packaging-specific tools are listed here.
patchelf = ">=0.19.2,<0.20"

[feature.package.tasks]
# WiX v5 as a project-local .NET tool: no global install, no admin rights.
# The util extension provides `WixUnelevatedShellExec`, which the package uses
# to start the tray as the installing user after an interactive install.
wix-tool = "dotnet tool update --tool-path .pixi/wix wix --version 5.0.2 && .pixi/wix/wix extension add -g WixToolset.Util.wixext/5.0.2"
# The version always comes from Cargo.toml (scripts read it, nothing is pinned).
msi = { cmd = "pwsh -NoProfile -File scripts/build_msi.ps1", depends-on = [
  "wix-tool",
  "release",
] }

# cargo-deb is not on conda-forge, so it is built into this environment.
deb-tool = "cargo install --locked --root \"$CONDA_PREFIX\" cargo-deb"
deb = { cmd = "cargo deb -o dist", depends-on = ["deb-tool", "release"] }
tarball = { cmd = "bash scripts/build_tarball.sh", depends-on = ["release"] }

# winget manifests for the MSI built above (dist/winget); see README §5.
winget = { cmd = "pwsh -NoProfile -File scripts/winget_manifest.ps1", depends-on = ["msi"] }

# `release` is platform specific: only Linux needs the rpath fixup.
[feature.package.target.win-64.tasks]
release = "cargo build --release"
debug = "cargo build"
# Local debugging: package the debug executable without the release profile's
# LTO; the settings footer shows `Debug` so the two cannot be confused.
msi-debug = { cmd = "pwsh -NoProfile -File scripts/build_msi.ps1 -BinPath target/debug/thunet.exe -Suffix -debug", depends-on = [
  "wix-tool",
  "debug",
] }


[feature.package.target.linux-64.tasks]
# The conda linker injects an absolute rpath pointing into this pixi
# environment; strip it so the tarball/deb use the system GTK at runtime.
release = "cargo build --release && patchelf --remove-rpath target/release/thunet"
