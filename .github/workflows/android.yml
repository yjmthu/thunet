name: Android

# A build check, not a release. This workflow compiles the APK and leaves it as a
# workflow artifact, so the port can be exercised without cutting a tag, creating
# a release, or touching the winget submission the `Release` workflow owns.
#
# The APK is signed when the four `ANDROID_*` secrets exist (see the "Materialize
# the signing key" step); without them it is built unsigned and the file name says
# so. Unsigned release APKs are useful only for a size or build check: Android
# refuses to install one, and it can never update an installed copy.
#
# Keep these build steps in step with the `android-apk` job in release.yml.
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "android/**"
      - "scripts/android_build.sh"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pixi.toml"
      - "pixi.lock"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK, arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # JDK 21 comes from the pixi `android` environment; the wrapper unpacks the
      # exact Gradle it pins, so the environment's `gradle` is not what runs.
      - uses: prefix-dev/setup-pixi@v0
        with:
          environments: android
          frozen: true
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # The runner image's default JDK is 11 and `sdkmanager` refuses anything
      # below 17 ("Your version was detected as 11.0.32.1"). The pixi environment
      # only exports JAVA_HOME inside `pixi run`, so the action that reads the SDK
      # licenses needs a JDK of its own; this one is also what Gradle would pick
      # up outside pixi.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # The default package list starts with `tools`, which no longer exists in
          # the SDK repository ("Failed to find package 'tools'"). Platform and
          # NDK are installed by the step below.
          packages: platform-tools

      - name: Install SDK platform and NDK
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "ndk;29.0.14206865"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk" || { echo "no Android SDK root from setup-android" >&2; exit 1; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/app/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Drop the developer proxy
        run: |
          # `android/gradle.properties` carries this project's development proxy
          # on 127.0.0.1:13395, and its own comment says those four lines belong in
          # ~/.gradle/gradle.properties on a machine that needs them. No runner has
          # that proxy, so the tracked copy is dropped for this build only.
          sed -i -E '/^systemProp\.https?\.proxy(Host|Port)=/d' android/gradle.properties

      # `secrets` is not an allowed context in a step's `if:`, so whether a key
      # exists is published as an output instead (same trick as WINGET_TOKEN in
      # release.yml).
      - name: Check for the signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building an unsigned APK."
          fi

      - name: Materialize the signing key
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # `storeFile` is resolved relative to the :app project, so it has to be
          # absolute here or Gradle looks under android/app/.
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > android/keystore.properties

      - name: Build APK
        run: pixi run -e android apk-release

      - name: Name the artifact
        id: apk
        env:
          SIGNED: ${{ steps.signing.outputs.enabled }}
        run: |
          set -euo pipefail
          suffix=""
          [ "$SIGNED" = 'true' ] || suffix="-unsigned"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          # Signed builds land in `app-release.apk`, unsigned ones in
          # `app-release-unsigned.apk`; taking whatever is there covers both.
          out="android/app/build/outputs/apk/release"
          apk="$(find "$out" -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "no APK under $out" >&2
            find android/app/build/outputs -name '*.apk' -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p dist
          file="dist/thunet-${version}-arm64${suffix}.apk"
          cp "$apk" "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -l "$file"

      - name: Check the signature
        if: steps.signing.outputs.enabled == 'true'
        env:
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          set -euo pipefail
          signer="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)"
          "$signer" verify --print-certs "$FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: thunet-arm64-apk
          path: dist/thunet-*-arm64*.apk
          if-no-files-found: error
          retention-days: 14
