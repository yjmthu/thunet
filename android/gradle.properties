org.gradle.jvmargs=-Xmx2g

# The proxy is reachable from the development machine; Google Maven is not
# reliably so. Move these four lines to ~/.gradle/gradle.properties when the
# project is built somewhere else.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=13395
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=13395
